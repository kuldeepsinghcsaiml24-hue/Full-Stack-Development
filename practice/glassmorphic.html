```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glass Effect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }
        .background-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .foreground-image {
            position: absolute;
            width: 420px;
            height: 500px;
            object-fit: cover;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7);
            z-index: 3;
            object-position: left;
        }

        .glass {

            position: absolute;

            width: 300px;
            height: 200px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35);
            z-index: 4;
        }


    </style>

</head>


<body>
    <img
        class="background-image"
        src="https://images.pexels.com/photos/3802667/pexels-photo-3802667.jpeg"
        alt=""
    >

    <div class="overlay"></div>
    <img
        class="foreground-image"
        src="https://miro.medium.com/v2/resize:fit:1200/1*H90ZEKu0LMMIp96R6jbH3w.png"
        alt=""
    >

    <div class="glass"></div>


</body>

</html>
```
