<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Comic Layout</title>
    <style>
        :root {
            --primary-color: rgb(105, 210, 210);
            --secondary-color: black;
            --size: 30px;
            --border-width: 2px;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        /* Main Outer Container */
        .container {
            display: grid;
            grid-template-rows: 1fr 1fr 1.8fr; /* 3 main rows matching the layout */
            gap: 12px;
            height: 600px;
            width: 450px;
            background-color: black; /* Serves as the gap/line color */
            padding: 8px;
            box-sizing: border-box;
        }

        /* Base Panel Style */
        .panel {
            background-color: white;
            position: relative;
        }

        /* --- ROW 1: Top Panel --- */
        .panel-1 {
            /* Slants down towards the right bottom edge */
            clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);
        }

        /* --- ROW 2: Middle Row (2 Panels) --- */
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 12px;
        }

        .panel-2 {
            /* Slanted top and angled right side */
            clip-path: polygon(0 15%, 100% 0%, 92% 100%, 0 100%);
        }

        .panel-3 {
            /* Slanted top and angled left side */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 8% 100%);
        }

        /* --- ROW 3: Bottom Row (3 Panels) --- */
        .row-3 {
            display: grid;
            grid-template-columns: 0.25fr 1fr 0.8fr;
            gap: 12px;
        }

        .panel-5 {
            /* Large central panel with slanted left and right edges */
            clip-path: polygon(10% 0, 100% 0, 85% 100%, 0% 100%);
        }

        .panel-6 {
            /* Rightmost panel tilted left */
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
        }

        /* --- Preserved Parent and Child Elements --- */
        #parent {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-color);
        }

        #child {
            background-color: orange;
            padding: 10px 20px;
            font-size: var(--size);
            color: white;
            cursor: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Row 1 -->
        <div class="panel panel-1"></div>

        <!-- Row 2 -->
        <div class="row-2">
            <div class="panel panel-2"></div>
            <div class="panel panel-3"></div>
        </div>

        <!-- Row 3 -->
        <div class="row-3">
            <div class="panel panel-4"></div>
            
            <!-- Parent Panel hosting the child -->
            <div class="panel panel-5">
                <div id="parent">
                    <div id="child">
                        Hello
                    </div>
                </div>
            </div>

            <div class="panel panel-6"></div>
        </div>
    </div>

</body>
</html>
