<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navigation Styling */
        nav {
            margin: 10px;
            padding: 0.5em 1.5em;
            border: 2px solid black;
            color: white;
            background-color: black;
            box-shadow: 4px 4px grey;
            border-radius: 30px;
            
            /* Flexbox to push logo to left and links to right */
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            color: rgb(165, 23, 23);
            cursor: pointer;
        }

        /* Logo/Picture at Far Left */

        /* Nav Links Alignment */
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem; /* Clean spacing between navigation items */
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Main Content Container Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .container div {
            border: 1px solid black;
            height: 200px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <!-- Logo / Picture placed at the far-left -->
            <div class="nav-logo">
                <h3>PITORA</h3>
            </div>

            <!-- Navigation Links -->
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
        </div>
    </main>

</body>
</html>
