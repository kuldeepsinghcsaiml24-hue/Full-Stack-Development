<head>

    <title>Document</title>
    <style>
        button{
            border-radius: 0px;
            border:1px solid black;
            background: black;
            color:white;
        }
        button:active{
            background-color: yellow;

        a{
            color:white;

        }
        a:hover{
            color:pink;
        }
        a:link{

        }
        a:active {
            color:aqua;
        }
        input:checked{
            accent-color: red;
        }
        input:not(:checked){
            box-shadow: 0px opx 5px black;
        }
        
        
    </style>
</head>
<body>
    <input type="checkbox" checked/>
    <input type="checkbox">
