<!DOCTYPE html>
<html lang="en">
<head>

        }
        .card3{
            display:flex;
            border:2px solid b;

        }

</head>
<body>
    <header>
        <h1>Product2</h1>

    <hr>
    <main>
        <div class="card-grid">

            <div class="card card2"><h2>product alpha2</h2></div>

</html>
